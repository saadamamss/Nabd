<button
  type="button"
  class="feedback-fab"
  [attr.aria-label]="'feedback.open' | transloco"
  [attr.title]="'feedback.open' | transloco"
  (click)="open()"
>
  <svg
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="1.8"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <path d="M20 11.5a7.5 7.5 0 0 1-11 6.6L4 19.5l1.4-4.9A7.5 7.5 0 1 1 20 11.5Z" />
    <path d="M8.5 11.5h7M8.5 8.5h4.5" />
  </svg>
  <span>{{ 'feedback.open' | transloco }}</span>
</button>

@if (isOpen()) {
  <div class="ui-overlay" role="presentation" (keydown.escape)="close()">
    <div
      class="ui-dialog feedback-dialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="feedback-title"
    >
      <h2 id="feedback-title">{{ 'feedback.title' | transloco }}</h2>
      <p class="ui-hint">{{ 'feedback.intro' | transloco }}</p>

      @if (problem(); as problem) {
        <p class="ui-note is-error" role="alert">
          {{ problem.key | transloco: problem.params }}
        </p>
      }

      <form (submit)="submit($event)">
        <label class="ui-field">
          <span>{{ 'feedback.message' | transloco }}</span>
          <textarea
            #box
            rows="4"
            [value]="message()"
            (input)="message.set(value($event))"
            aria-describedby="feedback-message-hint"
            required
          ></textarea>
          <small id="feedback-message-hint">
            {{ 'feedback.counter' | transloco: { count: count(), max: max } }}
            · {{ 'feedback.messageHint' | transloco }}
          </small>
        </label>

        <label class="ui-field">
          <span>
            {{ 'feedback.contact' | transloco }}
            <em class="feedback-optional">{{ 'common.optional' | transloco }}</em>
          </span>
          <input
            type="email"
            [value]="contact()"
            (input)="contact.set(value($event))"
            autocomplete="email"
          />
          <small>{{ 'feedback.contactHint' | transloco }}</small>
        </label>

        <div class="ui-actions">
          <button class="ui-btn" type="button" (click)="close()">
            {{ 'common.cancel' | transloco }}
          </button>
          <button class="ui-btn is-primary" type="submit" [disabled]="!canSend()">
            {{ (busy() ? 'feedback.sending' : 'feedback.send') | transloco }}
          </button>
        </div>
      </form>
    </div>
  </div>
}
