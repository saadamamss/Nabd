<section class="login">
  <div class="card">
    <h1>{{ 'auth.title' | transloco }}</h1>
    <p class="subtitle">{{ 'auth.subtitle' | transloco }}</p>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label class="field">
        <span>{{ 'auth.email' | transloco }}</span>
        <input
          type="email"
          formControlName="email"
          autocomplete="username"
          [attr.aria-invalid]="form.controls.email.invalid && form.controls.email.touched"
          dir="ltr"
        />
        @if (form.controls.email.invalid && form.controls.email.touched) {
          <span class="field-error">{{ 'auth.emailRequired' | transloco }}</span>
        }
      </label>

      <label class="field">
        <span>{{ 'auth.password' | transloco }}</span>
        <input
          type="password"
          formControlName="password"
          autocomplete="current-password"
          [attr.aria-invalid]="form.controls.password.invalid && form.controls.password.touched"
        />
        @if (form.controls.password.invalid && form.controls.password.touched) {
          <span class="field-error">{{ 'auth.passwordRequired' | transloco }}</span>
        }
      </label>

      @if (errorKey(); as key) {
        <p class="form-error" role="alert">{{ key | transloco }}</p>
      }

      <button type="submit" class="submit" [disabled]="submitting()">
        {{ (submitting() ? 'auth.signingIn' : 'auth.signIn') | transloco }}
      </button>
    </form>
  </div>
</section>
