<section class="ui-page">
  <header class="ui-head">
    <div>
      <span class="ui-kicker">{{ 'nav.settings' | transloco }}</span>
      <h1 class="ui-title">{{ 'settings.accountTitle' | transloco }}</h1>
      <p class="ui-sub">{{ 'settings.accountSubtitle' | transloco }}</p>
    </div>
  </header>

  <app-settings-tabs />

  <div class="ui-panel account-panel">
    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label class="ui-field">
        <span>{{ 'settings.currentPassword' | transloco }}</span>
        <input
          type="password"
          formControlName="current"
          autocomplete="current-password"
          (input)="clearProblems()"
          [attr.aria-invalid]="form.controls.current.invalid && form.controls.current.touched"
        />
        @if (form.controls.current.invalid && form.controls.current.touched) {
          <span class="field-error">{{ 'auth.passwordRequired' | transloco }}</span>
        } @else if (currentProblem(); as key) {
          <span class="field-error" role="alert">{{ key | transloco }}</span>
        }
      </label>

      <label class="ui-field">
        <span>{{ 'settings.newPassword' | transloco }}</span>
        <input
          type="password"
          formControlName="password"
          autocomplete="new-password"
          (input)="clearProblems()"
          [attr.aria-invalid]="form.controls.password.invalid && form.controls.password.touched"
        />
        <small>{{ 'settings.passwordNote' | transloco }}</small>
        @if (form.controls.password.invalid && form.controls.password.touched) {
          <span class="field-error">{{ 'auth.passwordRequired' | transloco }}</span>
        } @else if (passwordProblem(); as key) {
          <span class="field-error" role="alert">{{ key | transloco }}</span>
        }
      </label>

      <label class="ui-field">
        <span>{{ 'settings.confirmPassword' | transloco }}</span>
        <input
          type="password"
          formControlName="confirm"
          autocomplete="new-password"
          (input)="clearProblems()"
          [attr.aria-invalid]="
            (mismatch() || form.controls.confirm.invalid) && form.controls.confirm.touched
          "
        />
        @if (form.controls.confirm.invalid && form.controls.confirm.touched) {
          <span class="field-error">{{ 'auth.resetConfirmRequired' | transloco }}</span>
        } @else if (mismatch()) {
          <span class="field-error" role="alert">{{ 'auth.resetMismatch' | transloco }}</span>
        }
      </label>

      @if (problemKey(); as key) {
        <p class="form-error" role="alert">{{ key | transloco }}</p>
      }

      <div class="ui-actions">
        <button type="submit" class="ui-btn is-primary" [disabled]="saving()">
          {{ (saving() ? 'settings.changing' : 'settings.changePassword') | transloco }}
        </button>
      </div>
    </form>
  </div>
</section>
